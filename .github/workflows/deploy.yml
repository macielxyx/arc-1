name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tag this push
        if: github.event_name == 'push'
        run: node scripts/tag-version.mjs
      - name: Write version
        run: node scripts/write-version.mjs
      - run: npm install
      - run: npm run build
        env:
          VITE_FLOW_URL: ${{ secrets.VITE_FLOW_URL }}
          VITE_REFRESH_SECONDS: ${{ vars.VITE_REFRESH_SECONDS }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
