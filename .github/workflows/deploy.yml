name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tag this push
        if: github.event_name == 'push'
        run: node scripts/tag-version.mjs
      - name: Write version
        run: node scripts/write-version.mjs
      - name: Encrypt uploaded mailbox files
        env:
          MAILBOX_PASSWORD: ${{ secrets.MAILBOX_PASSWORD }}
        run: node scripts/ingest-mailbox.mjs
      - name: Remove the readable mailbox files
        run: |
          git add src/mailbox.tx.sealed.json src/mailbox.co.sealed.json
          git add -u mailbox
          if git diff --cached --quiet; then
            echo "No readable mailbox files to remove."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Encrypt the uploaded mailbox files and remove the readable copies."
          git push origin HEAD:main
      - run: npm install
      - run: npm run build
        env:
          VITE_FLOW_URL: ${{ secrets.VITE_FLOW_URL }}
          VITE_REFRESH_SECONDS: ${{ vars.VITE_REFRESH_SECONDS }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
